# A5: orchestrator-workers. The opt-in `agent` tool (shipped; design record in
# docs/proposals/archive/agent-tool.md). Same graph as A4; only `implement`
# changes. A `parallel` node is static topology decided by the author; the
# orchestrator decides the fan-out at runtime, from the plan. Each worker: same
# tree, fresh context, tool subset, own cost cap, own transcript in the run.
name: workshop-a5
goal: A4, with implement orchestrating one worker per package through the agent tool.
inputs:
  task: { type: string, required: true, description: The task }
defaults: { provider: anthropic, model: claude-sonnet-4-6 }
budget: 8.00
budget-policy: pause

steps:
  triage_context:
    type: tool
    run: |
      set -eu
      out=.fragua/scratch/workshop
      rm -rf "$out" && mkdir -p "$out"
      awk '/^## Codebase map/,/^## Commit conventions/' AGENTS.md > "$out/codebase-map.md"
    next: triage

  triage:
    type: judge
    state:
      task: ${{ inputs.task }}
      map:  {file: .fragua/scratch/workshop/codebase-map.md}
    questions:
      scope:
        type: choice
        instructions: Classify `task` against `map` for the work pipeline.
        criteria:
          small:   a contained change inside one package, no shared contract touched
          feature: multi-package, or a shared contract / schema / event changes
          bugfix:  a reported defect, reproduce it before fixing
    decide:
      route: {question: scope, min-confidence: 0.6, below: feature}
    routes:
      small:   {to: implement, label: "Small change"}
      feature: {to: plan,      label: "Feature scope"}
      bugfix:  {to: reproduce, label: "Bug fix"}

  plan:
    type: llm
    model: claude-opus-4-7            # strongest model where the thinking happens, once
    thread: build
    allowed-tools: [read, grep, find, ls]
    prompt: |
      Produce a numbered plan for ${{ inputs.task }}: files, tests (exact
      names), exports changed, order.
    next: implement

  reproduce:
    type: llm
    model: claude-sonnet-4-6          # localising a bug is mechanical reading; the test is the contract
    thread: build
    retry: reproduce                   # no asserting failing test ⇒ try again, capped
    max-retries: 2
    allowed-tools: [read, write, edit, grep, find, bash]
    prompt: |
      Bug: ${{ inputs.task }}. Write a FAILING test in the repo's framework
      and confirm it fails for the stated reason. Cannot localise → `abort`.
    next: implement

  implement:
    type: llm
    model: claude-sonnet-4-6          # the orchestrator integrates; workers may pick their own
    thread: build
    allowed-tools: [read, write, edit, grep, bash, agent]   # agent: opt-in, like web_fetch
    prompt: |
      Implement ${{ inputs.task }} from the plan in this thread.
      For EACH package the plan names, delegate that package's slice to an
      `agent` with only that package's files in scope and `outputs` of
      {files_touched: array<string>, tests_pass: boolean}. Then integrate:
      run the cross-package typecheck yourself. End with a PLAN_REALISED
      block that lists each worker's files_touched.
    next: review

  review:                              # the evaluator: fresh evidence at the point of decision
    type: llm
    model: claude-opus-4-7            # judgement is where being wrong costs most
    thread: build
    retry: implement                   # REJECT ⇒ send the author back
    max-retries: 2                     # after 2 rejections the run pauses for a human
    allowed-tools: [read, grep, bash]
    prompt: |
      Judge `git diff HEAD` against PLAN_REALISED: matches, nothing extra,
      every promised test real and non-trivial, no scope creep.
      `APPROVE: <one line>`, or `abort` with `REJECT: <one line>. fixes: <1-5>`.
    next: format

  format: { type: tool, run: bun run format, next: ci }

  ci:                                  # the check
    type: tool
    run: bun run ci
    timeout-minutes: 15
    max-retries: 5                     # after 5 red↔fix cycles the run pauses
    on: {success: exit, fail: fix}

  fix:                                 # the fixer
    type: llm
    model: claude-haiku-4-5           # cheapest: read a lint error, make a one-line fix
    allowed-tools: [read, write, edit, bash]
    prompt: |
      CI failed. Re-run `bun run ci`, read the failure, make the minimal fix,
      stop. Never disable a test, lower an assertion, or relax a linter.
    next: ci

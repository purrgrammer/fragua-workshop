<svg viewBox="0 0 1000 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="review-b5-title review-b5-desc"><title id="review-b5-title">review: pack, classify, verify, sign off</title><desc id="review-b5-desc">Flowchart of the review workflow: a tool materialises the PR diff, a judge routes it to skip, a quick pass, or two parallel read-only lenses each verified by a for-each judge; a synthesis on the strongest model writes the review; a human gate posts it, asks for a rewrite, or cancels.</desc><defs>

<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="work-a4-title work-a4-desc"><title id="work-a4-title">work: triage, build, review, ship</title><desc id="work-a4-desc">Flowchart of the work workflow: a judge triages the task to a plan, a reproduction, or straight to implement; a review gate sends rejected work back to implement at most twice; CI failures loop through a fixer at most five times before the run completes.</desc><defs>
